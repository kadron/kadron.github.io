  sections:
    summary:
      - Software engineer and security researcher with a PhD in program analysis and 4 years building fuzzing and constraint-solving tools for smart-contract security. Experienced in language design (parsers, interpreters, DSLs), input generation, and side-channel analysis, with publications at NDSS, ESEC/FSE, ISSTA, and ASE.

    experience:
      - company: Veridise
        position: Research Scientist
        start_date: 2022-11
        end_date: present
        location: Remote
        highlights:
          - Lead engineer on OrCa, Veridise's fuzzer for Solidity smart contracts (Python), used across the company's security audits
          - "Rewrote the LTL-based [V] specification language end to end: updated ANTLR grammar, a generator that converts parse trees to an intermediate representation, and the interpreter"
          - Designed and built from scratch a hint language that lets users specify how functions are fuzzed; user constraints are compiled to SMT-LIB and solved with Z3 to generate function inputs
          - Added on-chain fuzzing support, enabling OrCa to test deployed contracts against live chain state
          - Maintained OrCa's Rust EVM component, keeping it in sync with upstream dependencies including Foundry's EVM
          - Refactored core fuzzing components, improving performance and coverage
          - "Performed smart-contract and infrastructure security audits for 3 client protocols: ThetaNuts, Manta Network, and Stellar (Soroban core)"

      - company: University of California, Santa Barbara
        position: Graduate Student Researcher
        start_date: 2017-01
        end_date: 2022-09
        location: Santa Barbara, CA
        highlights:
          - Developed techniques to detect, quantify, and mitigate side-channel information leakage in encrypted network traffic
          - Built [TSA](https://github.com/kadron/tsa-tool), an open-source tool for network side-channel detection and quantification
          - Published at NDSS, ISSTA, and ESEC/FSE; represented UCSB Verification Lab in DARPA's STAC (Space/Time Analysis for Cybersecurity) program
          - Mentored one Master's and two undergraduate students on research projects, including CorbFuzz, a fuzzer for checking browser security policies (ASE 2021)

      - company: NASA Ames Research Center (KBR Inc.)
        position: Research Intern
        start_date: 2020-06
        end_date: 2020-09
        location: Remote
        highlights:
          - Analyzed robustness of Boeing's runway-image neural network for autonomous center-line tracking
          - Built a concolic analysis method that uses the Marabou verifier to check robustness to input perturbations and generate counterexample images
          - Published findings as a case study (VSTTE 2021)

      - company: Carnegie Mellon University, CyLab
        position: Research Intern
        start_date: 2018-06
        end_date: 2018-09
        location: Moffett Field, CA
        highlights:
          - Developed input generation techniques for side-channel analysis; represented CMU CyLab in DARPA STAC
          - Worked on adversarial input generation for neural networks using symbolic execution (ISSRE 2019)

      - company: University of California, Santa Barbara
        position: Teaching Assistant
        start_date: 2016-09
        end_date: 2018-06
        location: Santa Barbara, CA
        highlights:
          - Data Structures & Algorithms I & II, Formal Languages & Automata

      - company: Airties Wireless Networks
        position: Systems & Research Engineer (Part-time)
        start_date: 2013-06
        end_date: 2015-09
        location: Istanbul, Türkiye
        highlights:
          - Implemented mesh-networking code in C supporting client handover between Wi-Fi routers

