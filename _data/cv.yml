        level: Proficient
        icon: fa-solid fa-code
        keywords: "Python, Rust, Solidity, Java, C, Bash"

      - name: Research Areas
        level: Expert
        icon: fa-solid fa-magnifying-glass
        keywords: "Fuzzing, Formal Methods, Smart-Contract Auditing, Side-Channel Analysis, SMT-based Constraint Solving, Symbolic Execution"
      
      - name: Tools
