        icon: fa-solid fa-code
        keywords: "Z3, CVC5, ANTLR, Foundry, EVM, Docker, Git"
      
    # "Service" is not one of the section titles the al_folio_cv plugin renders with a
    # dedicated template (Education, Awards, Publications, Skills, Languages, Interests,
